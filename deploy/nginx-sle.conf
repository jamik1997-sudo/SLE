server {
    listen 80;
    server_name sle-audit.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sle-audit.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/sle-audit.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sle-audit.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 700;
    gzip_types application/json text/plain text/css application/javascript application/xml;

    keepalive_timeout 65;
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
    }
}
