server {
    listen 80;
    server_name sle-api.jamik1997.workers.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sle-api.jamik1997.workers.dev;

    ssl_certificate /etc/letsencrypt/live/sle-api.jamik1997.workers.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sle-api.jamik1997.workers.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;
    gzip on;
    gzip_vary on;
    gzip_min_length 700;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
