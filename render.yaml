services:
  - type: web
    name: sle-audit-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --disable-pip-version-check --prefer-binary -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true

